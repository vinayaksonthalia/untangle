[project]
name = "untangle"
version = "0.1.0"
description = "Multi-rail bank-credit attribution & Razorpay-slice reconciliation engine"
requires-python = ">=3.12"
# stdlib-first. Runtime has NO third-party dependencies.
# Test/dev tooling only:
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
# Optional: ECDSA-signed close certificates. The core is stdlib-only; without this extra (or a
# signing key) the certificate is still built and content-hashed — tamper-evident, just unsigned.
crypto = ["cryptography>=42"]
# Optional: Model Context Protocol (MCP) server for AI agent integration.
mcp = ["mcp>=1.8,<2"]  # v1 FastMCP; >=1.8 for streamable-HTTP transport (streamable_http_app). <2: FastMCP renamed in mcp 2.x

[tool.setuptools]
packages = ["engine", "engine.llm", "eval", "ui", "webapp", "generator"]
# Qodo #9: the MCP server is a root-level module, not a package — list it explicitly so a wheel install
# of untangle[mcp] ships the server, not just its dependency.
py-modules = ["mcp_server"]

[project.scripts]
untangle-mcp = "mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: FastAPI File()/Depends() defaults are idiomatic
