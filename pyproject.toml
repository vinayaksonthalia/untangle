[project]
name = "untangle"
version = "0.2.0"
description = "Multi-rail bank-credit attribution & Razorpay-slice reconciliation engine"
license = {file = "LICENSE"}
requires-python = ">=3.12"
# stdlib-first. Runtime has NO third-party dependencies.
# Test/dev tooling only:
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "httpx",
    "pytest-cov>=5",
    "ruff",
    "coverage[toml]>=7",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1",
    "authlib>=1.3,<2.0",
]
quality = ["mutmut>=3.6"]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "authlib>=1.3,<2.0",
]
db = ["sqlalchemy>=2.0,<3.0", "alembic>=1.13,<2.0", "psycopg[binary]>=3.1"]
# Optional: ECDSA-signed close certificates. The core is stdlib-only; without this extra (or a
# signing key) the certificate is still built and content-hashed — tamper-evident, just unsigned.
crypto = ["cryptography>=42"]
# Optional: Model Context Protocol (MCP) server for AI agent integration.
mcp = ["mcp>=1.8,<2"]  # v1 FastMCP; >=1.8 for streamable-HTTP transport (streamable_http_app). <2: FastMCP renamed in mcp 2.x

[tool.setuptools]
packages = ["engine", "engine.llm", "eval", "ui", "webapp", "generator", "persistence", "auth"]
# Qodo #9: the MCP server is a root-level module, not a package — list it explicitly so a wheel install
# of untangle[mcp] ships the server, not just its dependency.
py-modules = ["mcp_server"]

# The landing page is served from non-Python assets that must ship inside the wheel;
# without this a normal (non-editable) install fails to import webapp.app / serve "/".
[tool.setuptools.package-data]
webapp = [
    "templates/*.html",
    "static/*.css",
    "static/fonts/*.woff2",
    "static/fonts/*.txt",
    "static/fonts/*.md",
]

[project.scripts]
untangle-mcp = "mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["engine", "eval", "generator", "ui", "webapp", "persistence", "auth"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
skip_empty = true

[tool.mutmut]
# source_paths is the tree COPIED into mutmut's isolated mutants/ workspace, not the mutation
# selection. reconcile.py imports sibling engine modules (covered, evidence, models), so the whole
# engine package must be present or the isolated run fails to import. only_mutate then narrows the
# actual mutation to reconcile.py, keeping the reconciliation-only scope.
source_paths = ["engine"]
only_mutate = ["engine/reconcile.py"]
pytest_add_cli_args_test_selection = ["tests/unit/test_reconcile.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: FastAPI File()/Depends() defaults are idiomatic
