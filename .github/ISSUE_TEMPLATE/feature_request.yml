name: Feature request
description: Propose a bounded improvement to Untangle
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which finance-operations problem or user outcome needs improvement?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the smallest useful outcome, not just an implementation.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Correctness and privacy considerations
      description: Explain effects on evidence, abstention, schemas, financial data, or agent access.
