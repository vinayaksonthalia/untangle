name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test & lint (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]" ruff bandit
      - name: Ruff (lint)
        run: ruff check .
      - name: Generate the seeded dataset
        run: python -m generator.generate --seed 42 --scale 1.0 --out data
      - name: Run one pipeline (produces out/report.json for UI/eval tests)
        run: python -m engine.cli run --bank data/bank_statement.csv --recon data/recon_report.json --ledger data/order_ledger.csv --out out/
      - name: Tests
        run: python -m pytest
      - name: Bandit (Python security SAST)
        run: bandit -r engine eval ui webapp generator -q --skip B101,B311,B404,B603,B110
