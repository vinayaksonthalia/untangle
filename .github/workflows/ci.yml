name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test & lint (py${{ matrix.python }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: untangle_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web,mcp]" ruff bandit
      - name: Ruff (lint)
        run: ruff check .
      - name: Generate the seeded dataset
        run: python -m generator.generate --seed 42 --scale 1.0 --out data
      - name: Generate the sealed holdout (for the phase-5 gate test)
        run: python -m eval.sealed
      - name: Run one pipeline (produces out/report.json for UI/eval tests)
        run: python -m engine.cli run --bank data/bank_statement.csv --recon data/recon_report.json --ledger data/order_ledger.csv --out out/
      - name: Tests & branch-coverage gate
        env:
          POSTGRES_TEST_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/untangle_test
        run: |
          python -m pytest --cov --cov-report=term-missing
          python -m coverage json
          python scripts/branch_coverage_gate.py
      - name: Bandit (Python security SAST)
        run: bandit -r engine eval ui webapp generator persistence -q --skip B101,B311,B404,B603,B110

  security:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Semgrep
        run: |
          python -m pip install --upgrade pip semgrep
          semgrep scan --config p/python --config p/security-audit --severity ERROR --error \
            engine eval ui webapp generator persistence
